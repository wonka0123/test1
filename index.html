<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALECAL — 패션 행사 캘린더</title>
<style>
:root{--bg:#f5f4f1;--paper:#fff;--ink:#191919;--muted:#777;--line:#e5e2dc;--red:#ed2339;--green:#19845e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:26px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.logo{font-size:25px;font-weight:950;letter-spacing:-1px}.logo span{color:var(--red)}.sub,.muted{font-size:12px;color:var(--muted);margin-top:5px}.actions,.filters,.monthnav{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:750}.btn.dark,.chip.active{background:#191919;color:white;border-color:#191919}.btn.red{background:var(--red);color:white;border-color:var(--red)}.filters{margin:14px 0}.label{font-size:12px;color:var(--muted);margin-right:3px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,.85fr);gap:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 7px 22px #00000008}.calhead{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.month{font-size:18px;font-weight:900}.monthnav button{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:white}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{text-align:center;padding:10px 0;font-size:11px;color:#888;border-bottom:1px solid var(--line)}.week div:first-child{color:var(--red)}.day{min-height:102px;padding:7px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}.day:nth-child(7n){border-right:0}.day.out{background:#faf9f7;color:#c4c0ba}.date{font-size:11px;font-weight:800;margin:0 0 7px 3px}.bar{height:18px;line-height:18px;margin:3px 0;padding:0 4px;color:white;font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px}.bar.musinsa{background:#ed2339}.bar.cm29{background:#303030}.bar.wconcept{background:#6a53c6}.bar.zigzag{background:#e87835}.bar.ably{background:#208c76}.bar.other{background:#66717c}.side{padding:17px}.side h2{font-size:15px;margin:0}.count{font-size:11px;color:var(--muted);margin:5px 0 14px}.event{padding:12px;border:1px solid var(--line);border-radius:11px;display:grid;grid-template-columns:5px 1fr;gap:10px;margin-bottom:9px}.stripe{border-radius:8px;background:var(--red)}.event h3{font-size:13px;margin:0 0 7px}.badge{font-size:10px;font-weight:750;background:#f0efec;border-radius:999px;padding:3px 7px;margin-left:4px;white-space:nowrap}.event p{font-size:11px;line-height:1.65;color:#666;margin:0}.deadline{font-size:10px;font-weight:800;padding:3px 6px;border-radius:5px;margin-left:4px;background:#f0efec;color:#555}.deadline.urgent,.deadline.late{background:#ffe4e7;color:#c21b30}.deadline.done{background:#def4e9;color:#137653}.event a{display:inline-block;margin-top:7px;color:#555;font-size:11px}.check{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:#f4f3f0;padding:4px 7px;border-radius:999px;margin-left:5px;cursor:pointer}.check input{margin:0}.hint{font-size:11px;color:#888;line-height:1.7;margin-top:14px}.empty{font-size:12px;color:#888;padding:18px 0}.foot{text-align:center;font-size:10px;color:#999;margin-top:18px}.backdrop{display:none;position:fixed;inset:0;background:#0007;z-index:5;align-items:center;justify-content:center;padding:14px}.backdrop.show{display:flex}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{font-size:18px;margin:0}.close{border:0;border-radius:50%;width:30px;height:30px}.note{font-size:11px;line-height:1.6;background:#fff4db;padding:10px;border-radius:8px;margin-bottom:13px;color:#704b00}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#555}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:13px}.field textarea{min-height:60px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.adminrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee;font-size:12px}.adminrow button{border:0;border-radius:5px;padding:5px 7px;font-size:10px}.adminlist{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.day{min-height:78px}}@media(max-width:480px){.wrap{padding:16px 9px 30px}.logo{font-size:22px}.day{min-height:68px;padding:5px 2px}.date{font-size:10px}.bar{font-size:9px;height:16px;line-height:16px;padding:0 2px}.week div{font-size:10px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="logo">SALE<span>CAL</span> <span style="color:#999;font-size:11px;letter-spacing:0">BETA</span></div><div class="sub">패션 플랫폼 행사 · 마감일 · 신청 여부를 한눈에</div></div><div class="actions"><button class="btn" id="thisMonth">이번 달</button><button class="btn dark" id="manage">＋ 행사 관리</button></div></header>
<div class="filters" id="platforms"><span class="label">플랫폼</span></div>
<div class="layout"><section class="card"><div class="calhead"><div class="month" id="monthTitle"></div><div class="monthnav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid" id="calendar"></div></section>
<aside class="card side"><h2>행사 목록</h2><div class="count" id="count"></div><div class="filters" id="statusFilters"><button class="chip active" data-status="all">전체</button><button class="chip" data-status="urgent">마감 임박</button><button class="chip" data-status="notApplied">신청 전</button><button class="chip" data-status="applied">신청 완료</button></div><div id="list"></div><div class="hint">마감 3일 전부터 빨간색으로 표시해요. 일정은 변경될 수 있으니 공식 페이지에서 최종 확인하세요.</div></aside></div><div class="foot">SALECAL · 현재 데모 버전</div></main>
<div class="backdrop" id="backdrop"><section class="modal"><div class="modalhead"><h2>행사 관리</h2><button class="close" id="close">×</button></div><div class="note">현재 데모는 행사 정보와 신청 체크가 이 브라우저에만 저장됩니다. 공개 서비스에서 모두가 같은 일정을 보게 하고, 신청 체크는 개인별로 유지하려면 공용 데이터베이스와 로그인을 연결해야 해요.</div><form id="form"><input type="hidden" id="id"><div class="form">
<div class="field"><label for="platform">플랫폼</label><select id="platform"><option>무신사</option><option>29CM</option><option>W컨셉</option><option>지그재그</option><option>에이블리</option><option>기타</option></select></div>
<div class="field"><label for="title">행사명 *</label><input id="title" required placeholder="예: 멤버스데이"></div>
<div class="field"><label for="start">행사 시작일 *</label><input id="start" type="date" required></div><div class="field"><label for="end">행사 종료일 *</label><input id="end" type="date" required></div>
<div class="field full"><label for="deadline">신청 마감일</label><input id="deadline" type="date"></div>
<div class="field full"><label style="display:flex;align-items:center;gap:7px"><input id="applied" type="checkbox" style="width:16px;height:16px"> 신청 완료</label></div>
<div class="field full"><label for="url">공식 행사 URL</label><input id="url" type="url" placeholder="https://..."></div><div class="field full"><label for="description">메모</label><textarea id="description" placeholder="참여 조건 등"></textarea></div></div><div class="formactions"><button type="button" class="btn" id="cancel">취소</button><button type="submit" class="btn red">저장</button></div></form><div class="adminlist"><strong style="font-size:12px">등록된 행사</strong><div id="adminList"></div></div></section></div>
<script>
const STORE='salecal-v1';const today=new Date();let view=new Date(today.getFullYear(),today.getMonth(),1),activePlatform='전체',activeStatus='all';
const demo=[{id:'d1',platform:'무신사',title:'멤버스데이',start:'2026-11-01',end:'2026-11-03',deadline:'2026-10-31',applied:false,url:'',description:'데모 예시 일정'},{id:'d2',platform:'무신사',title:'패션위크',start:'2026-11-02',end:'2026-11-12',deadline:'2026-11-01',applied:false,url:'',description:'데모 예시 일정'},{id:'d3',platform:'29CM',title:'이굿위크',start:'2026-11-05',end:'2026-11-10',deadline:'2026-11-03',applied:true,url:'',description:'신청 완료 예시'},{id:'d4',platform:'W컨셉',title:'시즌 기획전',start:'2026-11-16',end:'2026-11-22',deadline:'2026-11-12',applied:false,url:'',description:'데모 예시 일정'}];
let events=JSON.parse(localStorage.getItem(STORE)||'null')||demo;const platforms=['전체','무신사','29CM','W컨셉','지그재그','에이블리','기타'];const slug={'무신사':'musinsa','29CM':'cm29','W컨셉':'wconcept','지그재그':'zigzag','에이블리':'ably','기타':'other'};const $=x=>document.getElementById(x);const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const parse=s=>new Date(s+'T12:00:00');const fmt=s=>s?Number(s.slice(5,7))+'/'+Number(s.slice(8,10)):'미설정';const dayDiff=s=>Math.round((parse(s)-parse(iso(today)))/86400000);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=e=>!e.deadline?'마감일 미설정':dayDiff(e.deadline)<0?'마감 '+Math.abs(dayDiff(e.deadline))+'일 지남':dayDiff(e.deadline)===0?'오늘 마감':dayDiff(e.deadline)<=3?'D-'+dayDiff(e.deadline)+' · 마감 임박':'D-'+dayDiff(e.deadline);const urgency=e=>!e.deadline?'neutral':dayDiff(e.deadline)<0?'late':dayDiff(e.deadline)<=3?'urgent':'neutral';const color={'무신사':'#ed2339','29CM':'#303030','W컨셉':'#6a53c6','지그재그':'#e87835','에이블리':'#208c76','기타':'#66717c'};
function visible(){return events.filter(e=>(activePlatform==='전체'||e.platform===activePlatform)&&(activeStatus==='all'||(activeStatus==='urgent'&&!e.applied&&e.deadline&&dayDiff(e.deadline)>=0&&dayDiff(e.deadline)<=3)||(activeStatus==='notApplied'&&!e.applied)||(activeStatus==='applied'&&e.applied)));}
function renderPlatforms(){$('platforms').innerHTML='<span class="label">플랫폼</span>'+platforms.map(p=>'<button class="chip '+(p===activePlatform?'active':'')+'" data-p="'+p+'">'+p+'</button>').join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{activePlatform=b.dataset.p;render()})}
function renderCalendar(){let y=view.getFullYear(),m=view.getMonth();$('monthTitle').textContent=y+'.'+String(m+1).padStart(2,'0');let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),out='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let date=iso(d),bars=visible().filter(e=>e.start<=date&&e.end>=date).map(e=>'<div class="bar '+(slug[e.platform]||'other')+'" title="'+esc(e.title)+'">'+(date===e.start||d.getDay()===0?esc(e.title):'&nbsp;')+'</div>').join('');out+='<div class="day '+(d.getMonth()===m?'':'out')+'"><div class="date">'+d.getDate()+'</div>'+bars+'</div>'}$('calendar').innerHTML=out}
function renderList(){let y=view.getFullYear(),m=view.getMonth(),arr=visible().filter(e=>{let a=parse(e.start),b=parse(e.end),first=new Date(y,m,1),last=new Date(y,m+1,0,23,59);return a<=last&&b>=first}).sort((a,b)=>{if(a.applied!==b.applied)return a.applied?1:-1;return (a.deadline||a.start).localeCompare(b.deadline||b.start)});$('count').textContent=arr.length+'개 일정 · '+y+'년 '+(m+1)+'월';$('list').innerHTML=arr.map(e=>'<article class="event"><div class="stripe" style="background:'+(e.applied?'#19845e':color[e.platform]||'#66717c')+'"></div><div><h3>'+esc(e.title)+' <span class="badge">'+esc(e.platform)+'</span><label class="check"><input type="checkbox" '+(e.applied?'checked':'')+' onchange="toggleApplied(\''+e.id+'\',this.checked)">신청 완료</label></h3><p>행사 기간 '+fmt(e.start)+' – '+fmt(e.end)+'<br>신청 마감 '+fmt(e.deadline)+' <span class="deadline '+urgency(e)+'">'+status(e)+'</span>'+(e.description?'<br>'+esc(e.description):'')+'</p>'+(e.url?'<a href="'+esc(e.url)+'" target="_blank" rel="noopener">공식 행사 페이지 ↗</a>':'')+'</div></article>').join('')||'<div class="empty">조건에 맞는 일정이 없어요.</div>'}
function renderAdmin(){$('adminList').innerHTML=events.slice().sort((a,b)=>(a.deadline||a.start).localeCompare(b.deadline||b.start)).map(e=>'<div class="adminrow"><span>'+esc(e.title)+' · '+fmt(e.deadline)+'</span><span><button onclick="editEvent(\''+e.id+'\')">수정</button> <button onclick="deleteEvent(\''+e.id+'\')">삭제</button></span></div>').join('')||'<div class="empty">등록된 일정이 없어요.</div>'}
function render(){renderPlatforms();renderCalendar();renderList();renderAdmin()}function save(){localStorage.setItem(STORE,JSON.stringify(events));render()}function resetForm(){ $('form').reset();$('id').value='';$('start').value=iso(new Date(view.getFullYear(),view.getMonth(),1));$('end').value=$('start').value}
function editEvent(id){let e=events.find(x=>x.id===id);if(!e)return;$('id').value=e.id;$('platform').value=e.platform;$('title').value=e.title;$('start').value=e.start;$('end').value=e.end;$('deadline').value=e.deadline||'';$('applied').checked=!!e.applied;$('url').value=e.url||'';$('description').value=e.description||''}
function deleteEvent(id){if(confirm('이 일정을 삭제할까요?')){events=events.filter(e=>e.id!==id);save()}}function toggleApplied(id,checked){let e=events.find(x=>x.id===id);if(e){e.applied=checked;save()}}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('thisMonth').onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);render()};$('statusFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeStatus=b.dataset.status;$('statusFilters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});$('manage').onclick=()=>{$('backdrop').classList.add('show');renderAdmin()};$('close').onclick=$('cancel').onclick=()=>{$('backdrop').classList.remove('show')};$('backdrop').onclick=e=>{if(e.target===$('backdrop'))$('backdrop').classList.remove('show')};
$('form').onsubmit=e=>{e.preventDefault();let start=$('start').value,end=$('end').value,deadline=$('deadline').value;if(end<start){alert('행사 종료일은 시작일 이후여야 해요.');return}let id=$('id').value||crypto.randomUUID(),item={id,platform:$('platform').value,title:$('title').value.trim(),start,end,deadline,applied:$('applied').checked,url:$('url').value.trim(),description:$('description').value.trim()};let i=events.findIndex(x=>x.id===id);if(i>=0)events[i]=item;else events.push(item);save();resetForm()};
resetForm();render();
</script></body></html>
